{% extends "base.html" %}
{% block title %}Error {{code}} - Omnipost{% endblock %}
{% from "base.html" import icon %}
{% block body %}
<div class="card" style="max-width:560px;margin:40px auto;text-align:center">
<div style="display:flex;justify-content:center;margin-bottom:16px;color:var(--err)"><span style="width:48px;height:48px;display:inline-flex">{{ icon('x-circle') }}</span></div>
<h1 style="font-size:28px">{{title}}</h1>
<p class="sub">{{msg}}</p>
<div style="display:flex;gap:10px;justify-content:center;margin-top:16px">
<a class="btn btn-ghost" href="/">Kembali ke Dashboard</a>
<a class="btn btn-ghost" href="/akun">Ke List Akun</a>
</div>
</div>
{% endblock %}
